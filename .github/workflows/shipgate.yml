# The SPERT® Suite ship gate, run automatically.
#
# Until now no SPERT repository had any CI at all: a green `gh pr checks` meant
# Vercel had built a preview and nothing more, so a branch whose entire test
# suite failed showed all-green and merged cleanly.
#
# This runs the same `npm run shipgate` a human runs locally — there is one gate
# definition, invoked two ways, so the two can never disagree. Everything
# repo-specific lives in shipgate.config.json, not here.

name: Ship gate

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the gate only reads the repository. The repository's default
# token is already read-only; stating it here keeps the gate least-privilege
# even if that setting changes, and closes CodeQL's
# actions/missing-workflow-permissions alert (security review A-11, 2026-10-25).
permissions:
  contents: read

jobs:
  shipgate:
    runs-on: ubuntu-latest
    # PROOF (temporary, reverted before this PR is ready): four runners at once
    # on this branch's helper, and four on main's as a must-find control.
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4]
        helper: [rest, main-sdk-control]
    steps:
      # Actions are pinned to exact, soaked versions rather than floating major
      # tags. The suite's 60-day dependency soak window applies here too: `@v6`
      # would silently admit a release published days ago. These are the newest
      # versions that have soaked (checkout 2026-01-09, setup-node 2026-04-20),
      # and both run on Node 24 — the v4 line targets the deprecated Node 20.
      - uses: actions/checkout@v6.0.2

      # PROOF control leg: main's SDK-reader helper put back, unchanged, so
      # the same loop must still find the failure on these runners.
      - name: 'proof control: put back main''s SDK-reader helper'
        if: matrix.helper == 'main-sdk-control'
        run: |
          git fetch --depth=1 origin fa470ee912802251471a221a9cad56b907b8627f
          git show FETCH_HEAD:emulator-tests/helpers.ts > emulator-tests/helpers.ts
          git diff --stat
          grep -c getDocFromServer emulator-tests/helpers.ts

      - uses: actions/setup-node@v6.4.0
        with:
          # Read the version from the repo's own .nvmrc rather than hardcoding a
          # major. `node-version: '24'` FLOATS to the newest 24.x on the runner —
          # it resolved to 24.18.0 on 2026-07-30 — so CI silently ignored every
          # repo’s pin. That matters because the pins are not decorative:
          # spert-admin-tool caps at "24.15.x - 24.17.x" to dodge a Node >=24.18
          # regression (raised Buffer.poolSize makes React's streaming SSR call
          # ArrayBuffer.transfer() on a pooled buffer → "ArrayBuffer is not
          # detachable"). A hardcoded major would run that gate on the exact
          # version it exists to forbid. Every repo carries an .nvmrc, so this
          # line stays byte-identical across all of them.
          node-version-file: '.nvmrc'
          cache: npm

      # `npm ci` installs strictly from package-lock.json. It fails outright if
      # the lockfile and package.json disagree, which makes it a second,
      # independent check on the version drift the gate looks for.
      - run: npm ci

      - run: npm run shipgate

      # ── PROOF (temporary, reverted before this PR is ready) ─────────────────
      # Run 46069457476 (draft PR #120) ran this exact shape on main's helper:
      # 5 of 40 runs of project-prefs.test.tsx failed. Same shape here, on the
      # REST helper; every run counts, and any failure turns the job red.
      - name: 'proof: the emulator tier alone, verbose'
        if: always()
        run: npm run test:emulator -- run --reporter=verbose

      - name: 'proof: the prefs file alone, eight times'
        if: always()
        run: |
          failed=0
          for i in 1 2 3 4 5 6 7 8; do
            echo "=== the prefs file alone, run $i"
            npm run test:emulator -- run --reporter=verbose emulator-tests/project-prefs.test.tsx || { echo "=== run $i FAILED"; failed=$((failed+1)); }
          done
          echo "=== $failed of 8 runs failed"
          test "$failed" -eq 0

      - name: 'proof: keep the emulator logs of any failure'
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: emulator-logs-${{ matrix.n }}-${{ matrix.helper }}
          path: /tmp/spert-cfd-emulator-*
          if-no-files-found: warn
          retention-days: 14
